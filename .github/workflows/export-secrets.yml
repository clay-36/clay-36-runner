name: Export encrypted Actions secrets

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: encrypted-secret-export
  cancel-in-progress: false

jobs:
  export:
    name: Export encrypted secrets
    runs-on: ubuntu-latest
    environment: Prod
    timeout-minutes: 5

    steps:
      - name: Install age
        run: |
          sudo apt-get update
          sudo apt-get install --yes age

      - name: Encrypt allowlisted secrets
        shell: bash
        env:
          AGE_RECIPIENT: age18hmv5cu5m8j2veg2u36ejcmgjnkuwl40u69lqlvdy6e940cy83dq7xy7p8
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPEN_AI_API_KEY: ${{ secrets.OPEN_AI_API_KEY }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RSS_PROXY_TOKEN: ${{ secrets.RSS_PROXY_TOKEN }}
          RSS_PROXY_URL: ${{ secrets.RSS_PROXY_URL }}
        run: |
          set -euo pipefail

          node <<'NODE' | age \
            --recipient "$AGE_RECIPIENT" \
            --output github-actions-secrets.json.age
          const names = [
            "CLOUDFLARE_API_TOKEN",
            "GEMINI_API_KEY",
            "OPEN_AI_API_KEY",
            "PRIVATE_REPO_TOKEN",
            "RSS_PROXY_TOKEN",
            "RSS_PROXY_URL",
          ];

          const unavailable = names.filter(
            (name) => !process.env[name],
          );

          if (unavailable.length > 0) {
            throw new Error(
              `Unavailable secrets: ${unavailable.join(", ")}`,
            );
          }

          const values = Object.fromEntries(
            names.map((name) => [name, process.env[name]]),
          );

          process.stdout.write(JSON.stringify(values));
          NODE

      - name: Upload encrypted artifact
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-actions-secrets-${{ github.run_id }}
          path: github-actions-secrets.json.age
          if-no-files-found: error
          retention-days: 1
